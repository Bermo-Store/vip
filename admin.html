<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BERMO STORE - الإدارة</title><style>
body{margin:0;font-family:Arial;background:#f5f7fb;color:#172033}header{background:#111827;color:#fff;padding:18px 5%;display:flex;justify-content:space-between}main{max-width:1100px;margin:auto;padding:25px 15px}.panel,.item{background:#fff;border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 6px 20px #1118270b}input{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}button{padding:11px 18px;border:0;border-radius:10px;cursor:pointer;font-weight:800}.blue{background:#2563eb;color:#fff}.red{background:#dc2626;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}.muted{color:#6b7280}</style></head><body>
<header><strong>BERMO STORE — الإدارة</strong><a href="index.html" style="color:#fff">المتجر</a></header><main>
<div id="login" class="panel"><h2>تسجيل الدخول</h2><input id="u" value="admin"><input id="p" type="password" value="1991"><button class="blue" onclick="login()">دخول</button><p id="m" class="muted"></p></div>
<div id="app" style="display:none"><div class="panel"><button class="blue" onclick="add()">إضافة اشتراك</button> <button onclick="load()">تحديث</button></div><div id="grid" class="grid"></div></div></main>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbwnWxnPRi7rqR_QqlXWHB4kUDFd6uxq_4BfYKZEEKqv-Up8ztKLTwXVH76VJuJ6mZTNJg/exec";let token="",items=[],$=id=>document.getElementById(id);
function apiGet(params,done){let cb="adm_"+Date.now(),s=document.createElement("script"),q=new URLSearchParams(params),ok=false;q.set("callback",cb);window[cb]=x=>{if(ok)return;ok=true;delete window[cb];s.remove();done(null,x)};s.onerror=()=>{if(ok)return;ok=true;delete window[cb];s.remove();done(Error("تعذر الاتصال"))};s.src=API_URL+"?"+q;document.body.appendChild(s);setTimeout(()=>{if(!ok){ok=true;delete window[cb];s.remove();done(Error("انتهت المهلة"))}},15000)}
function login(){apiGet({action:"adminLogin",username:$("u").value,password:$("p").value},(e,r)=>{if(e||!r||!r.ok){$("m").textContent=(r&&r.error)||"بيانات الدخول غير صحيحة";return}token=r.data.token;localStorage.bermo_token=token;$("login").style.display="none";$("app").style.display="block";load()})}
function load(){apiGet({action:"getProducts",all:"1",token},(e,r)=>{if(e||!r||!r.ok){alert((r&&r.error)||"تعذر الاتصال");return}items=r.data||[];render()})}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){$("grid").innerHTML=items.map(p=>'<div class="item"><h3>'+esc(p.title)+'</h3><p>'+esc(p.price)+" "+esc(p.currency||"")+' — '+esc(p.duration||"")+'</p><button class="red" onclick="del(\''+String(p.id).replace(/'/g,"\\'")+'\')">حذف</button></div>').join("")}
function post(o){let f=document.createElement("form");f.method="POST";f.action=API_URL;f.target="bg";let x=document.createElement("input");x.name="payload";x.value=JSON.stringify(o);f.appendChild(x);document.body.appendChild(f);f.submit();f.remove()}
function del(id){if(confirm("حذف الاشتراك؟")){post({action:"deleteProduct",id:id,token:token});setTimeout(load,700)}}
function add(){let title=prompt("اسم الاشتراك");if(!title)return;let price=prompt("السعر","0");post({action:"saveProduct",token:token,product:{title:title,price:Number(price)||0,currency:"$",days:30,duration:"شهر",active:true}});setTimeout(load,700)}
let fr=document.createElement("iframe");fr.name="bg";fr.style.display="none";document.body.appendChild(fr);
if(localStorage.bermo_token){token=localStorage.bermo_token;apiGet({action:"getProducts",all:"1",token:token},(e,r)=>{if(!e&&r&&r.ok){$("login").style.display="none";$("app").style.display="block";items=r.data||[];render()}})}
</script></body></html>
